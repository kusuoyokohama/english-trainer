<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 家族限定・検索避け -->
<meta name="robots" content="noindex, nofollow">
<title>不規則動詞 書き取り</title>
<style>
/* 紙に印刷して手で書くためのページ（漢字ドリルと同じ「見本→5回書く」形式）。
   紙の見た目に合わせて、あえてライトテーマ1つに固定している */
@page { size: A4 portrait; margin: 10mm; }
:root{ --ink:#1b2333; --sub:#5b6478; --brand:#4f7cff; }
*{box-sizing:border-box}
html,body{margin:0; background:#fff; color:var(--ink)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;   /* 見本マスの色を印刷でも残す */
}
.sheet{width:190mm; max-width:100%; margin:0 auto; padding:6mm 12px}
.page2{break-before:page; page-break-before:always; margin-top:10mm}

/* 見出し */
.head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
      border-bottom:2px solid var(--ink); padding-bottom:2mm; margin-bottom:3mm}
.head h1{font-size:15pt; margin:0; letter-spacing:.04em}
.head .date{font-size:10pt; color:var(--sub); white-space:nowrap}
.how{font-size:9.5pt; color:var(--sub); margin:0 0 4mm; line-height:1.6}
.how b{color:var(--ink)}

/* 1語ぶん */
.word{margin:0 0 3.2mm; break-inside:avoid}
.lab{font-size:10pt; margin:0 0 1mm; display:flex; align-items:center; gap:6px}
.no{display:inline-grid; place-items:center; width:5.2mm; height:5.2mm; border-radius:50%;
    background:var(--brand); color:#fff; font-size:8pt; font-weight:700; flex:0 0 auto}
.lab .base{font-weight:800; font-size:11pt}
.lab .jp{color:var(--sub)}
svg{display:block; width:100%; height:auto}

/* 確認テスト */
.test{display:grid; grid-template-columns:1fr 1fr; gap:4mm 8mm}
.test .lab{font-size:10pt}

/* 画面で見るときだけの印刷ボタン */
.print{display:inline-block; margin:0 0 4mm; padding:8px 16px; border:0; border-radius:10px;
       background:var(--brand); color:#fff; font-size:14px; font-weight:700; cursor:pointer}
@media print{ .print{display:none} .sheet{padding:0} }
</style>
</head>
<body>

<div class="sheet">
  <button class="print" type="button" onclick="window.print()">🖨 印刷する</button>

  <div class="head">
    <h1>不規則動詞 書き取り ①　過去形</h1>
    <span class="date">　　月　　日</span>
  </div>
  <p class="how">
    灰色のマスが<b>見本</b>。右の5マスに1回ずつ書く。<br>
    書くたびに <b>「bring, brought」</b> のように、原形と過去形を声に出すと覚えやすい。
  </p>
  <div id="drill"></div>
</div>

<div class="sheet page2">
  <div class="head">
    <h1>確認テスト（見本を見ないで書く）</h1>
    <span class="date">　　月　　日</span>
  </div>
  <p class="how">1ページ目を隠して、過去形を書く。書き終わったら1ページ目で答え合わせ。</p>
  <div id="test" class="test"></div>
</div>

<script>
/* ===== 書き取りの10語 =====
   英語トレの学習記録（9/6〜9/18）で過去形を間違えた回数・新しさの順に選んだ。
   ここを差し替えれば、別の10語のプリントになる */
const WORDS = [
  {base:"bring", past:"brought", jp:"持ってくる"},
  {base:"buy",   past:"bought",  jp:"買う"},
  {base:"go",    past:"went",    jp:"行く"},
  {base:"leave", past:"left",    jp:"去る"},
  {base:"know",  past:"knew",    jp:"知っている"},
  {base:"come",  past:"came",    jp:"来る"},
  {base:"speak", past:"spoke",   jp:"話す"},
  {base:"make",  past:"made",    jp:"作る"},
  {base:"sing",  past:"sang",    jp:"歌う"},
  {base:"hear",  past:"heard",   jp:"聞こえる"},
];

/* 英語の4線（学校のノートと同じ）をSVGで描く。
   枠線や色は背景ではなく線として描くので、印刷しても消えない。
   width: 全体の幅(mm) / cells: マスの数 / model: 1マス目に入れる見本（なければ空） */
function fourLines(width, cells, model){
  const H = 12, top = 0.5;                 // 4線の高さ12mm＝1段4mm（中1でも書きやすい大きさ）
  const cw = width / cells;
  const y = [0, 4, 8, 12].map(function(v){ return v + top; });
  let s = '<svg viewBox="0 0 ' + width + ' ' + (H + 1) + '" role="img" aria-label="'
        + (model ? model + ' を5回書くマス' : '書くマス') + '">';
  if(model){                               // 見本マスは薄い灰色で塗る
    s += '<rect x="0" y="' + top + '" width="' + cw + '" height="' + H + '" fill="#eef1f7"/>';
  }
  y.forEach(function(v, i){                // 3本目が文字の土台になる線（赤）
    const red = (i === 2);
    s += '<line x1="0" x2="' + width + '" y1="' + v + '" y2="' + v + '" stroke="'
       + (red ? '#e5484d' : '#b9c0cf') + '" stroke-width="' + (red ? 0.35 : 0.2) + '"/>';
  });
  for(let i = 0; i <= cells; i++){         // マスの区切り
    const x = Math.min(width - 0.15, Math.max(0.15, i * cw));
    s += '<line x1="' + x + '" x2="' + x + '" y1="' + top + '" y2="' + (H + top)
       + '" stroke="#8d95a8" stroke-width="0.3"/>';
  }
  if(model){                               // 見本の文字は3本目の線に乗せる
    s += '<text x="' + (cw / 2) + '" y="' + y[2] + '" text-anchor="middle" font-size="6.8"'
       + ' font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1b2333">' + model + '</text>';
  }
  return s + '</svg>';
}
function esc(t){ return String(t).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

/* 1ページ目：見本1マス＋書く5マス */
document.getElementById('drill').innerHTML = WORDS.map(function(w, i){
  return '<div class="word">'
       + '<div class="lab"><span class="no">' + (i + 1) + '</span>'
       + '<span class="base">' + esc(w.base) + '</span>'
       + '<span class="jp">（' + esc(w.jp) + '）の過去形</span></div>'
       + fourLines(190, 6, esc(w.past))
       + '</div>';
}).join('');

/* 2ページ目：順番を入れ替えて出す（並び順で覚えてしまわないように） */
const ORDER = [6, 2, 9, 0, 4, 7, 1, 5, 8, 3];
document.getElementById('test').innerHTML = ORDER.map(function(k, i){
  const w = WORDS[k];
  return '<div class="word">'
       + '<div class="lab"><span class="no">' + (i + 1) + '</span>'
       + '<span class="base">' + esc(w.base) + '</span>'
       + '<span class="jp">（' + esc(w.jp) + '）→</span></div>'
       + fourLines(88, 1, null)
       + '</div>';
}).join('');
</script>
</body>
</html>
